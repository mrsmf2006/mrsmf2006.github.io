<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سید محمد فخری — DevOps & Development</title>
    
    <!-- Modern Typography (Persian + English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* --- Design System (Modern Professional) --- */
        :root {
            --bg-main: #0A0E27;       
            --bg-surface: #131726;    
            --bg-card: #1A1F3A;
            --text-primary: #E8EAED;  
            --text-secondary: #9CA3AF;
            --text-muted: #6B7280;
            --border-color: #262B44;  
            --accent: #3B82F6;
            --accent-hover: #60A5FA;
            --success: #10B981;
            --radius: 16px;
            --radius-sm: 8px;           
            --font-main: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-persian: 'Vazirmatn', 'Geist', sans-serif;
            --max-width: 1000px;       
            --space-section: 80px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: var(--font-main);
            -webkit-font-smoothing: antialiased;
            scroll-behavior: smooth;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 24px;
            min-height: 100vh;
            direction: rtl;
            font-family: var(--font-persian);
        }
        
        body * {
            direction: rtl;
        }
        
        .en {
            direction: ltr;
            font-family: var(--font-main);
        }

        header, main, footer {
            width: 100%;
            max-width: var(--max-width);
        }

        /* --- Header & Nav --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 32px 0;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 64px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .logo a {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            text-decoration: none;
        }
        
        .logo .subtitle {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 400;
        }

        nav { display: flex; gap: 32px; }
        
        nav a {
            font-size: 15px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: all 0.2s ease;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
        }
        
        nav a:hover { 
            color: var(--text-primary);
            background: var(--bg-surface);
        }
        
        nav a.active { 
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        /* --- Global Structural Styles --- */
        section { margin-bottom: var(--space-section); }
        
        .section-title {
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: 32px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        /* --- Hero --- */
        .hero {
            margin-bottom: 64px;
        }
        
        .hero h1 {
            font-size: 42px;
            font-weight: 700;
            line-height: 1.2;
            margin-bottom: 16px;
            background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .hero .role {
            font-size: 22px;
            color: var(--accent);
            font-weight: 500;
            margin-bottom: 24px;
        }
        
        .hero p {
            font-size: 17px;
            line-height: 1.7;
            color: var(--text-secondary);
            margin-bottom: 32px;
            max-width: 700px;
        }
        
        .contact-links {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .contact-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 14px;
            transition: all 0.2s ease;
        }
        
        .contact-link:hover {
            background: var(--bg-surface);
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-2px);
        }

        /* --- Grid Layouts (About, Projects) --- */
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
        .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; }
        
        .list-col h3 { font-size: 14px; font-weight: 500; margin-bottom: 16px; }
        .list-col ul { list-style: none; }
        .list-col li { font-size: 14px; color: var(--text-secondary); margin-bottom: 10px; line-height: 1.5; }

        /* --- Cards (Projects & Experience) --- */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 28px;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            transition: all 0.3s ease;
        }
        
        .card:hover { 
            border-color: var(--accent);
            background: var(--bg-surface);
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(59, 130, 246, 0.15);
        }
        
        .card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }
        
        .card h3 { 
            font-size: 18px; 
            color: var(--text-primary); 
            margin-bottom: 6px;
            font-weight: 600;
        }
        
        .card .company {
            font-size: 14px;
            color: var(--accent);
            margin-bottom: 8px;
        }
        
        .card .period {
            font-size: 13px;
            color: var(--text-muted);
            white-space: nowrap;
        }
        
        .card p { 
            font-size: 15px; 
            color: var(--text-secondary); 
            margin-bottom: 16px; 
            line-height: 1.6; 
        }
        
        .card ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        
        .card li {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            padding-right: 20px;
            position: relative;
        }
        
        .card li:before {
            content: "◆";
            position: absolute;
            right: 0;
            color: var(--accent);
            font-size: 10px;
        }
        
        .tags { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            margin-top: auto; 
        }
        
        .tag { 
            font-size: 12px; 
            color: var(--text-secondary); 
            background: rgba(59, 130, 246, 0.1); 
            padding: 6px 12px; 
            border-radius: 6px; 
            border: 1px solid rgba(59, 130, 246, 0.2);
            font-weight: 500;
        }

        /* --- Lists (Timeline, Writing, Books) --- */
        .timeline-item, .list-item {
            display: flex;
            margin-bottom: 24px;
            align-items: baseline;
        }
        .timeline-item .year { width: 80px; font-size: 14px; font-weight: 500; color: var(--text-primary); flex-shrink: 0; }
        .timeline-item .event { font-size: 14px; color: var(--text-secondary); }
        
        .article-link {
            display: flex;
            justify-content: space-between;
            text-decoration: none;
            padding: 12px 0;
            border-bottom: 1px solid transparent;
            transition: border-color 0.2s ease;
        }
        .article-link:hover { border-color: var(--border-color); }
        .article-link .title { font-size: 15px; color: var(--text-primary); }
        .article-link .meta { font-size: 14px; color: var(--text-secondary); }

        /* --- Markdown Article Renderer --- */
        .article-header { margin-bottom: 48px; }
        .article-header h1 { font-size: 32px; font-weight: 500; margin-bottom: 16px; letter-spacing: -0.02em; }
        .article-header .meta { font-size: 14px; color: var(--text-secondary); display: flex; gap: 16px; }
        
        .markdown-body { font-size: 16px; line-height: 1.7; color: var(--text-primary); }
        .markdown-body p { margin-bottom: 24px; color: var(--text-secondary); }
        .markdown-body h2 { font-size: 20px; font-weight: 500; margin: 40px 0 16px 0; }
        .markdown-body a { color: var(--accent); text-decoration: none; }
        .markdown-body a:hover { text-decoration: underline; }
        .markdown-body blockquote { border-left: 2px solid var(--border-color); padding-left: 16px; font-style: italic; color: var(--text-secondary); margin-bottom: 24px; }
        .markdown-body ul { margin-bottom: 24px; padding-left: 20px; color: var(--text-secondary); }
        .markdown-body li { margin-bottom: 8px; }

        /* --- Skills Grid --- */
        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }
        
        .skill-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .skill-item span {
            font-size: 15px;
            color: var(--text-primary);
        }
        
        .skill-level {
            display: flex;
            gap: 4px;
        }
        
        .skill-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--border-color);
        }
        
        .skill-dot.active {
            background: var(--accent);
        }

        /* --- Footer --- */
        footer {
            margin-top: auto;
            padding: 48px 0;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
        }
        
        footer a {
            color: var(--accent);
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }

        /* --- Responsive --- */
        @media (max-width: 640px) {
            header { flex-direction: column; align-items: flex-start; gap: 24px; padding: 32px 0; }
            nav { flex-wrap: wrap; gap: 16px; }
            .grid-3, .grid-2 { grid-template-columns: 1fr; gap: 24px; }
            .timeline-item { flex-direction: column; gap: 8px; }
            .article-link { flex-direction: column; gap: 8px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <a href="#/">سید محمد فخری</a>
            <span class="subtitle">DevOps Engineer</span>
        </div>
        <nav>

            <a href="#/experience" class="nav-link">تجربیات</a>

            <a href="#/skills" class="nav-link">مهارت‌ها</a>
        </nav>

    <footer>
        <div>
            <p>ساخته شده با علاقه و کنجکاوی 💙</p>
            <p style="margin-top: 8px;">© 2026 سید محمد فخری • علاقه‌مند به یادگیری مادام‌العمر و حل مسائل ریز و درشت</p>
        </div>
    </footer>

    <!-- Scripts -->
    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
